# Render Blueprint: render.com → New → Blueprint → select this repository.
# You will be prompted for the values marked `sync: false`.
services:
  - type: web
    name: mantiq
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free plan: no card needed. It sleeps after 15 min idle, and with no disk uploaded audio
    # lasts until the next restart (transcripts and incidents live in Postgres).
    # For durable audio: set plan to starter and add
    #   disk: { name: audio, mountPath: /app/storage, sizeGB: 1 }
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mantiq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GNANI_API_KEY
        sync: false          # your Gnani key (Prisma + Timbre)
      - key: PRISMA_MODE
        value: live
      - key: PRISMA_LANGUAGE_CODE
        value: en-IN
      - key: TIMBRE_MODE
        value: live
      - key: EVON_MODE
        value: mock          # switch to live once you have an Evon endpoint
      - key: EVON_BASE_URL
        sync: false
      - key: EVON_API_KEY
        sync: false
      - key: AI_MODE
        value: live          # fix suggestions and translation with Google Gemini
      - key: GEMINI_API_KEY
        sync: false          # your Gemini API key (aistudio.google.com)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SEED_DEMO
        value: "false"       # "true" creates the older sample plant (Narmada Steel) on start
      - key: SEED_PASSWORD
        sync: false          # password for the sample plant accounts, if SEED_DEMO is on
      - key: SHOWCASE_RESET
        value: "false"       # "true": on the next start, wipe ALL data once and create the showcase plant
      - key: SHOWCASE_ADMIN_PASSWORD
        sync: false
      - key: SHOWCASE_SUPERVISOR_PASSWORD
        sync: false
      - key: SHOWCASE_TECH1_PASSWORD
        sync: false
      - key: SHOWCASE_TECH2_PASSWORD
        sync: false

databases:
  - name: mantiq-db
    databaseName: mantiq
    user: mantiq
    plan: free
